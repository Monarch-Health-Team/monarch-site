<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 128 128" width="128" height="128">
  <!-- Monarch Health butterfly, in the brand orange, on every tab bar.

       It used to carry two marks and switch between them on
       prefers-color-scheme: orange for light tab bars, white for dark
       ones. That is the right idea and it does not work. A browser
       rasterises a favicon once and does not re-evaluate the media query
       when the system theme changes, so the tab keeps whichever mark it
       happened to bake until something reloads it - which is how a white
       butterfly ended up invisible on a light tab bar (client, 22 Sep
       2026: "the tab doesn't auto-load, so the day favicon shows").

       One mark instead, chosen to work on both. #d33f00 measures 4.66:1
       on white and 3.50:1 on Chrome's dark chrome (#202124), against a
       3:1 floor for non-text. The white mark was punchier on a dark tab
       and unreadable on half of them.

       This also puts the SVG in line with favicon.ico and apple-icon.png,
       which were always orange. Safari does not load SVG favicons and
       falls back to the .ico, so the three now agree. -->
  <image width="128" height="128" xlink:href="data:image/png;base64,"/>
</svg>
