name: Agent assign
on:
  issues:
    types: [opened, labeled]
permissions:
  contents: read
concurrency:
  group: agent-assign-${{ github.event.issue.number }}
jobs:
  assign:
    if: contains(github.event.issue.labels.*.name, 'agent')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Assign the Claude agent
        env:
          GH_TOKEN: ${{ secrets.AGENT_ASSIGN_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
        run: |
          set -euo pipefail
          already=$(gh api graphql -f query='query($id:ID!){node(id:$id){... on Issue{assignees(first:10){nodes{login}}}}}' -f id="$ISSUE_ID" --jq '[.data.node.assignees.nodes[].login] | any(. == "Claude")')
          if [ "$already" = "true" ]; then echo "Claude already assigned"; exit 0; fi
          bot=$(gh api graphql -f query='query($o:String!,$r:String!){repository(owner:$o,name:$r){suggestedActors(capabilities:[CAN_BE_ASSIGNED],first:50){nodes{login ... on Bot{id}}}}}' -f o="$OWNER" -f r="$REPO" --jq '.data.repository.suggestedActors.nodes[] | select(.login=="anthropic-code-agent") | .id')
          if [ -z "$bot" ]; then echo "Claude agent not available"; exit 1; fi
          gh api graphql -H 'GraphQL-Features: issues_copilot_assignment_api_support' -f query='mutation($i:ID!,$b:ID!){addAssigneesToAssignable(input:{assignableId:$i,assigneeIds:[$b]}){clientMutationId}}' -f i="$ISSUE_ID" -f b="$bot"
          echo "Assigned Claude"
