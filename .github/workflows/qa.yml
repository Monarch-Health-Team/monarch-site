name: QA

# Team Beta QA template v2 (identical in every repo; logic in .github/scripts/qa.sh, per-repo
# settings in .github/qa.config.json):
#   app present -> install (pnpm or npm, from the lockfile) -> lint / typecheck / test / build (each only
#   if set up) -> app's own Playwright suite (if qa.config.json sets appE2e) -> browser checks
#   (.github/e2e: crawl, nav/footer links, mobile drawer, console errors, screenshots at 375/1280)
#   -> issue acceptance tests (.qa/issues, desktop + mobile) -> Argos upload (informational)
#   -> Lighthouse (median of 3, thresholds in the repo's lighthouserc).
# No package.json at all = FAIL with a clear message, so QA never passes vacuously.
#  - pull_request / workflow_dispatch: normal check, goes red on failure.
#  - push to main: same checks; also gives Argos the main baseline the PR screenshots are compared with.
#  - workflow_call: used by claude-build.yml. The job stays green and returns `passed` + a short
#    `summary` so the caller can hand failures to Claude. In these runs the checks themselves come from
#    main's .github (a trusted copy), so a Claude branch can never weaken its own QA.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Branch or SHA to test
        required: true
        type: string
      branch:
        description: Branch name of that ref (for Argos and the issue-test check)
        required: false
        type: string
        default: ""
      pr:
        description: Pull request number, when there is one (for Argos)
        required: false
        type: string
        default: ""
    secrets:
      ARGOS_TOKEN:
        required: false
    outputs:
      passed:
        description: "'true' when every QA step passed"
        value: ${{ jobs.qa.outputs.passed }}
      summary:
        description: Failure summary, max 6000 chars (empty on pass)
        value: ${{ jobs.qa.outputs.summary }}
      sha:
        description: Commit that was tested
        value: ${{ jobs.qa.outputs.sha }}

permissions:
  contents: read

concurrency:
  group: qa-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  qa:
    # Skip the standalone pull_request run on Claude-build PRs (cc/*) opened and pushed by
    # github-actions[bot]: QA already ran inside "Claude build" (this file via workflow_call).
    # Still runs when called from Claude build, on manual dispatch, and when a person pushes to cc/*.
    if: >-
      !(github.event_name == 'pull_request' &&
        startsWith(github.head_ref, 'cc/') &&
        github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.actor == 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_VERSION: "1.64.1" # also the browser-cache key; bump here only
      QA_LOOP: ${{ (inputs.ref || '') != '' }}
    outputs:
      passed: ${{ steps.result.outputs.passed }}
      summary: ${{ steps.result.outputs.summary }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0
          persist-credentials: false

      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Claude-loop runs: take the checks (.github: qa.sh, e2e base suite, qa.config.json, lighthouserc)
      # from main, not from the branch under test.
      - name: Trusted QA checks from main (Claude loop only)
        if: (inputs.ref || '') != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          path: .qa-trusted
          sparse-checkout: .github
          persist-credentials: false

      - name: Use the trusted copy
        if: (inputs.ref || '') != ''
        run: |
          mv .qa-trusted/.github "$RUNNER_TEMP/qa-trusted" && rm -rf .qa-trusted
          echo "QA_HOME=$RUNNER_TEMP/qa-trusted" >> "$GITHUB_ENV"
          if ! diff -rq .github/e2e "$RUNNER_TEMP/qa-trusted/e2e" >/dev/null 2>&1 || \
             ! diff -q .github/scripts/qa.sh "$RUNNER_TEMP/qa-trusted/scripts/qa.sh" >/dev/null 2>&1; then
            echo "::notice::This branch's .github QA files differ from main's; main's copy is used."
          fi

      - name: Detect app
        id: detect
        run: bash "${QA_HOME:-.github}/scripts/qa.sh" detect

      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.has_package == 'true' && steps.detect.outputs.pm == 'pnpm'
        with:
          version: ${{ steps.detect.outputs.pnpm_version }}

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.has_package == 'true' && steps.detect.outputs.has_lockfile == 'true'
        with:
          node-version: ${{ steps.detect.outputs.node_version }}
          cache: ${{ steps.detect.outputs.pm }}

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.has_package == 'true' && steps.detect.outputs.has_lockfile != 'true'
        with:
          node-version: ${{ steps.detect.outputs.node_version }}

      - name: Install dependencies
        run: bash "${QA_HOME:-.github}/scripts/qa.sh" install

      - name: Lint
        run: bash "${QA_HOME:-.github}/scripts/qa.sh" lint

      - name: Typecheck
        run: bash "${QA_HOME:-.github}/scripts/qa.sh" typecheck

      - name: Unit tests
        run: bash "${QA_HOME:-.github}/scripts/qa.sh" test

      - name: Build
        run: bash "${QA_HOME:-.github}/scripts/qa.sh" build

      - name: App Playwright suite (only if qa.config.json sets appE2e)
        run: bash "${QA_HOME:-.github}/scripts/qa.sh" app-e2e

      - name: Cache Playwright chromium
        if: steps.detect.outputs.has_package == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-shell

      - name: Browser tests + issue tests + Argos upload
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
          QA_BRANCH: ${{ inputs.branch || github.head_ref || github.ref_name }}
          QA_SHA: ${{ steps.sha.outputs.sha }}
          QA_PR: ${{ inputs.pr || github.event.pull_request.number }}
        run: bash "${QA_HOME:-.github}/scripts/qa.sh" e2e

      - name: Lighthouse CI (3 runs, median)
        run: bash "${QA_HOME:-.github}/scripts/qa.sh" lighthouse

      - name: Result
        id: result
        if: always()
        run: bash "${QA_HOME:-.github}/scripts/qa.sh" result

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts-${{ steps.sha.outputs.sha }}
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail the check (direct runs only)
        # In a workflow_call, github.workflow is the caller's name, so this
        # only fails the job for pull_request / push / workflow_dispatch runs.
        if: always() && steps.result.outputs.passed != 'true' && github.workflow == 'QA'
        run: exit 1
