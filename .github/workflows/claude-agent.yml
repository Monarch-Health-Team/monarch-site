name: Claude agent (reusable)

# One Claude Code session, called only by claude-build.yml.
#   mode=build: branch off main, implement the issue, push cc/issue-N, open a PR.
#   mode=fix:   on the existing branch, fix QA failures and/or follow-up
#               instructions, push.
# Two jobs on purpose:
#   edit    - runs Claude with a READ-ONLY GitHub token. Claude can only edit
#             files and run the repo's lint/typecheck/test/build scripts (pnpm or
#             npm, picked from the lockfile). Output is a patch.
#             Bootstrap: while main has no package.json, Claude may also run
#             `pnpm install` / `pnpm add` to scaffold the app, and the new
#             pnpm-lock.yaml is kept (afterwards the lockfile is off limits again).
#             In build mode Claude also writes .qa/issues/issue-N.spec.ts, a Playwright
#             test of the issue's acceptance criteria that QA runs (template v2).
#             In QA-driven fix rounds (round 1-2) existing .qa/issues files are
#             restored, so a fix round cannot weaken the issue test; .github is
#             always restored, so the base QA checks can't be touched at all.
#   publish - plain git/gh steps (no AI) apply the patch, commit, push, open PR.
on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      issue_number:
        description: Issue (build) or PR (fix) number, for title/description
        type: string
        required: true
      branch:
        type: string
        required: true
      round:
        type: string
        default: "0"
      qa_summary:
        type: string
        default: ""
      instructions:
        description: Extra instructions from a /claude fix comment
        type: string
        default: ""
    outputs:
      changed:
        value: ${{ jobs.edit.outputs.changed }}
      sha:
        value: ${{ jobs.publish.outputs.sha }}
      pr_number:
        value: ${{ jobs.publish.outputs.pr_number }}
      claude_reason:
        description: Plain-English reason when the Claude step did not finish (empty when it did)
        value: ${{ jobs.edit.outputs.claude_reason }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  edit:
    runs-on: ubuntu-latest
    # Big multi-part issues need 40-50+ turns (~10-25 min); keep room above the Claude step's own limit.
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      claude_reason: ${{ steps.check.outputs.reason }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUM: ${{ inputs.issue_number }}
      MODE: ${{ inputs.mode }}
      ROUND: ${{ inputs.round }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.mode == 'build' && 'main' || inputs.branch }}
          persist-credentials: false

      - name: Detect app
        id: app
        run: |
          pkg=false; lock=false; pmf=""; pm=pnpm; lockfile=pnpm-lock.yaml
          [ -f package.json ] && pkg=true && pmf=$(jq -r '.packageManager // ""' package.json)
          if [ -f pnpm-lock.yaml ]; then lock=true
          elif [ -f package-lock.json ]; then lock=true; pm=npm; lockfile=package-lock.json
          elif [[ "$pmf" == npm@* ]]; then pm=npm; lockfile=package-lock.json; fi
          ver=""; [[ "$pmf" == pnpm@* ]] || ver=$(jq -r '.pnpmVersion // "10"' .github/qa.config.json 2>/dev/null || echo 10)
          node=$(jq -r '.node // "22"' .github/qa.config.json 2>/dev/null || echo 22)
          # The checks Claude may run, in the repo's own words (only scripts that exist).
          run="pnpm"; [ "$pm" = npm ] && run="npm run"
          checks=""
          for s in lint typecheck test build; do
            if [ -f package.json ] && jq -e --arg s "$s" '.scripts[$s] // empty' package.json >/dev/null; then checks+="${checks:+|}$run $s"; fi
          done
          [ -n "$checks" ] || checks="$run lint|$run typecheck|$run test|$run build"
          { echo "has_package=$pkg"; echo "has_lockfile=$lock"; echo "pm=$pm"; echo "lockfile=$lockfile"
            echo "pnpm_version=$ver"; echo "node_version=$node"; echo "checks=$checks"; } | tee -a "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.app.outputs.pm == 'pnpm'
        with:
          version: ${{ steps.app.outputs.pnpm_version }}

      - uses: actions/setup-node@v4
        if: steps.app.outputs.has_lockfile == 'true'
        with:
          node-version: ${{ steps.app.outputs.node_version }}
          cache: ${{ steps.app.outputs.pm }}

      - uses: actions/setup-node@v4
        if: steps.app.outputs.has_lockfile != 'true'
        with:
          node-version: ${{ steps.app.outputs.node_version }}

      - name: Install dependencies
        if: steps.app.outputs.has_package == 'true'
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci --no-audit --no-fund
          elif [ "${{ steps.app.outputs.pm }}" = npm ]; then npm install --no-audit --no-fund
          else pnpm install --no-frozen-lockfile; fi

      - name: Build the prompt
        id: ctx
        env:
          QA_SUMMARY: ${{ inputs.qa_summary }}
          INSTRUCTIONS: ${{ inputs.instructions }}
          REPO_DESCRIPTION: ${{ vars.CLAUDE_REPO_DESCRIPTION }}
          HAS_PACKAGE: ${{ steps.app.outputs.has_package }}
          CHECKS: ${{ steps.app.outputs.checks }}
        run: |
          PROJECT="$REPO_DESCRIPTION"
          [ -n "$PROJECT" ] || PROJECT=$(sed -n 's/^Project: *//p' CLAUDE.md .claude/CLAUDE.md 2>/dev/null | head -n1 || true)
          [ -n "$PROJECT" ] || PROJECT="$REPO"
          title=$(gh api "repos/$REPO/issues/$NUM" --jq '.title')
          body=$(gh api "repos/$REPO/issues/$NUM" --jq '.body // ""')
          {
            if [ "$MODE" = build ]; then
              echo "Implement GitHub issue #$NUM in this repository ($PROJECT)."
              echo
              echo "Title: $title"
              echo
              echo "Description:"
              printf '%s\n' "$body"
              if [ "$HAS_PACKAGE" != true ]; then
                echo
                echo "This repository has no app yet (no package.json). Scaffold it first, following CLAUDE.md:"
                echo "Next.js (App Router) + TypeScript + Tailwind CSS, pnpm, source in src/. Write package.json by hand"
                echo "(you cannot run create-next-app) with scripts dev, build, start, lint (eslint), typecheck (tsc --noEmit)"
                echo "and, if you add tests, test (vitest run). Then run \`pnpm install\` so pnpm-lock.yaml is created; you may"
                echo "use \`pnpm add\` / \`pnpm add -D\` for the packages the scaffold needs. Keep dependencies minimal."
              fi
              echo
              echo "Also write a Playwright test for this issue's acceptance criteria at .qa/issues/issue-$NUM.spec.ts,"
              echo "following .github/e2e/ISSUE-SPEC.md (import only @playwright/test, relative URLs, role/text selectors)."
              echo "You can't run it; QA runs it on desktop and mobile. Test only what this issue asks for."
            else
              echo "You are on the branch of pull request #$NUM: $title"
              if [ -n "$INSTRUCTIONS" ]; then
                echo
                echo "The owner asked for these changes:"
                printf '%s\n' "$INSTRUCTIONS"
                echo "If this changes what a test in .qa/issues/ checks, update that test too (see .github/e2e/ISSUE-SPEC.md)."
              fi
              if [ -n "$QA_SUMMARY" ]; then
                echo
                echo "Automated QA failed (fix round $ROUND of 2). Fix the real cause in the app, within this PR's"
                echo "scope; keep the intended change. Tests in .qa/issues/ are locked in this round (edits are reverted):"
                echo "if an issue test fails, fix the app, not the test. QA output:"
                printf '%s\n' "$QA_SUMMARY"
              fi
            fi
            echo
            echo "Rules: follow CLAUDE.md. Edit files only; you cannot run git or gh, and a separate step"
            echo "commits your work. Files under .github/ are reset after you finish. Before finishing, run"
            echo "$(printf '%s' "$CHECKS" | sed 's/|/, /g') and fix what you broke."
            echo
            echo "Scope and QA guardrails:"
            echo "- Stay within the issue's scope (and the owner's requested changes); change nothing else."
            echo "- Never change product behaviour, copy, links or accessibility labels (aria-*, roles, accessible"
            echo "  names), and never delete, skip or weaken an existing test, just to get a QA check to pass."
            echo "- If a QA check conflicts with the issue spec, or the failure looks pre-existing (it would also fail"
            echo "  on main, or is in code this issue doesn't touch), stop: don't work around it. Explain it in your"
            echo "  summary on a line starting 'QA conflict:' so the owner can fix main or the QA settings."
            echo "Finish with a 3-6 line plain-English summary of what you changed."
          } > "$RUNNER_TEMP/prompt.txt"
          { echo "prompt<<PROMPT_EOF_7c1"; cat "$RUNNER_TEMP/prompt.txt"; echo "PROMPT_EOF_7c1"; } >> "$GITHUB_OUTPUT"
          tools="Read,Edit,MultiEdit,Write,Glob,Grep,TodoWrite"
          # Exact command plus the same command with arguments (e.g. `pnpm lint --fix`, `pnpm test -- file`),
          # so Claude doesn't burn turns on permission denials.
          IFS='|' read -ra cs <<< "$CHECKS"; for c in "${cs[@]}"; do tools+=",Bash($c),Bash($c:*)"; done
          [ "$HAS_PACKAGE" = true ] || tools+=",Bash(pnpm install),Bash(pnpm add:*)"
          echo "tools=$tools" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        timeout-minutes: 40
        # The action fails a run that *finished successfully* when it used more turns than --max-turns
        # ("Claude reported a successful result after 47 turns, exceeding the configured maximum of 40"),
        # which threw away finished work. "Check Claude result" below decides pass/fail from the real result.
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions[bot],github-actions"
          # Read-only token on purpose: skips the Claude GitHub App/OIDC path
          # and means nothing in this job can push or comment.
          github_token: ${{ github.token }}
          prompt: ${{ steps.ctx.outputs.prompt }}
          claude_args: >-
            --model ${{ vars.CLAUDE_MODEL || 'sonnet' }}
            --max-turns ${{ vars.CLAUDE_MAX_TURNS || (steps.app.outputs.has_package != 'true' && '120' || (inputs.mode == 'build' && '100' || '60')) }}
            --allowedTools "${{ steps.ctx.outputs.tools }}"
            --disallowedTools "WebFetch,WebSearch"

      - name: Make the patch
        id: patch
        if: always()
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          LOCKFILE: ${{ steps.app.outputs.lockfile }}
        run: |
          # Workflows/QA checks, env files and (once it exists on main) the lockfile are off limits for the agent.
          git checkout HEAD -- .github 2>/dev/null || true
          git clean -fdq -- .github
          if git cat-file -e "HEAD:$LOCKFILE" 2>/dev/null; then
            git checkout HEAD -- "$LOCKFILE"
          elif git cat-file -e HEAD:package.json 2>/dev/null; then
            rm -f "$LOCKFILE"   # app existed without a lockfile: the agent may not create one
          fi
          # QA-driven fix rounds may not weaken the issue tests already on the branch (new files are allowed).
          if [ "$MODE" = fix ] && [ "$ROUND" != 0 ] && git cat-file -e HEAD:.qa/issues 2>/dev/null; then
            git checkout HEAD -- .qa/issues
          fi
          git add -A
          git reset -q -- ':(glob)**/.env*' 2>/dev/null || true
          git diff --cached --binary > "$RUNNER_TEMP/claude.patch"
          if [ -s "$RUNNER_TEMP/claude.patch" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          git diff --cached --stat
          if [ -n "$EXEC_FILE" ] && [ -f "$EXEC_FILE" ]; then
            jq -r '[.[] | select(.type=="result")] | last | .result // ""' "$EXEC_FILE" | head -c 3000 > "$RUNNER_TEMP/claude-summary.md" || true
          fi
          touch "$RUNNER_TEMP/claude-summary.md"

      - uses: actions/upload-artifact@v4
        if: always() && steps.patch.outputs.changed == 'true'
        with:
          name: claude-patch-${{ github.run_id }}-${{ inputs.mode }}-${{ inputs.round }}
          path: |
            ${{ runner.temp }}/claude.patch
            ${{ runner.temp }}/claude-summary.md
          retention-days: 3

      # Decides whether the Claude step really failed, and says why in plain words (the report comment uses it).
      - name: Check Claude result
        id: check
        if: always()
        env:
          OUTCOME: ${{ steps.claude.outcome }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          MAX_TURNS: ${{ vars.CLAUDE_MAX_TURNS || (steps.app.outputs.has_package != 'true' && '120' || (inputs.mode == 'build' && '100' || '60')) }}
        run: |
          f="$EXEC_FILE"; { [ -n "$f" ] && [ -f "$f" ]; } || f="$RUNNER_TEMP/claude-execution-output.json"
          r='{}'; [ -f "$f" ] && r=$(jq -c '[.[] | select(.type=="result")] | last // {}' "$f" 2>/dev/null || echo '{}')
          subtype=$(jq -r '.subtype // ""' <<<"$r"); is_error=$(jq -r '.is_error // false' <<<"$r")
          turns=$(jq -r '.num_turns // "?"' <<<"$r"); mins=$(jq -r '((.duration_ms // 0) / 60000 | floor)' <<<"$r")
          text=$(jq -r '.result // "" | tostring' <<<"$r" | tr '\n' ' ' | cut -c1-300)
          denied=$(jq -r '(.permission_denials // [])[] | "\(.tool_name) \((.tool_input.command // .tool_input.file_path // "") | tostring | .[0:120])"' <<<"$r" 2>/dev/null | sort | uniq -c | sort -rn | head -n 10 || true)
          status=fail; reason=""
          if [ "$OUTCOME" = success ]; then status=ok
          elif [ "$subtype" = success ] && [ "$is_error" != true ]; then
            status=ok; echo "::warning::Claude finished in $turns turns (over the $MAX_TURNS cap); keeping its work."
          elif [ "$subtype" = error_max_turns ]; then
            reason="it ran out of turns ($turns of $MAX_TURNS, ${mins} min). The issue is too big for one run: split it into smaller issues, or raise the CLAUDE_MAX_TURNS repo variable"
          elif printf '%s' "$text" | grep -qiE 'usage limit|rate.?limit|429|overloaded|credit'; then
            reason="Claude hit a usage or rate limit: ${text:0:200}"
          elif printf '%s' "$text" | grep -qiE '401|unauthori|oauth|invalid.*token|authenticat'; then
            reason="the Claude login was refused (CLAUDE_CODE_OAUTH_TOKEN may be expired; JJ renews it with \`claude setup-token\`): ${text:0:200}"
          elif [ -n "$subtype" ]; then
            reason="Claude stopped with an error ($subtype after $turns turns): ${text:-no message}"
          else
            reason="the Claude step never returned a result: it hit the 40-minute step limit or could not start (see the 'Run Claude Code' step in the log)"
          fi
          echo "Claude step: outcome=$OUTCOME subtype=${subtype:-none} turns=$turns minutes=$mins status=$status"
          [ -n "$denied" ] && { echo "Permission denials (count, tool, command):"; printf '%s\n' "$denied"; }
          { echo "### Claude step"; echo "outcome \`$OUTCOME\`, result \`${subtype:-none}\`, $turns turns, ${mins} min"
            [ -n "$reason" ] && echo "**Did not finish:** $reason"
            [ -n "$denied" ] && { echo; echo "Permission denials:"; printf '%s\n' "$denied" | sed 's/^/    /'; }; } >> "$GITHUB_STEP_SUMMARY"
          echo "reason=$(printf '%s' "$reason" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          if [ "$status" != ok ]; then echo "::error::Claude did not finish: $reason"; exit 1; fi

  publish:
    needs: edit
    if: needs.edit.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: read
      pull-requests: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      pr_number: ${{ steps.pr.outputs.number }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUM: ${{ inputs.issue_number }}
      MODE: ${{ inputs.mode }}
      ROUND: ${{ inputs.round }}
      BRANCH: ${{ inputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.mode == 'build' && 'main' || inputs.branch }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: claude-patch-${{ github.run_id }}-${{ inputs.mode }}-${{ inputs.round }}
          path: ${{ runner.temp }}/claude

      - name: Commit and push
        id: commit
        run: |
          git apply --index "$RUNNER_TEMP/claude/claude.patch"
          title=$(gh api "repos/$REPO/issues/$NUM" --jq '.title')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$MODE" = build ]; then
            git checkout -q -b "$BRANCH"
            git commit -q -m "${title} (#${NUM})" -m "Built by Claude Code (claude-build workflow)."
          else
            git commit -q -m "Claude fix round ${ROUND} (#${NUM})"
          fi
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        id: pr
        if: inputs.mode == 'build'
        run: |
          title=$(gh api "repos/$REPO/issues/$NUM" --jq '.title')
          {
            echo "Closes #${NUM}"
            echo
            echo "Built by Claude Code. QA runs automatically in the same workflow; failures go back to Claude (max 2 fix rounds)."
            echo "Comment \`/claude fix <what to change>\` on this PR for follow-up changes."
            echo
            echo "### Claude's summary"
            cat "$RUNNER_TEMP/claude/claude-summary.md" 2>/dev/null || true
          } > "$RUNNER_TEMP/pr-body.md"
          url=$(gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "${title} (#${NUM})" --body-file "$RUNNER_TEMP/pr-body.md")
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
