name: QA trigger
# Starts QA as jeffreyjoju on every agent pull request push, drafts included,
# because GitHub holds QA runs from agent pushes for approval.
on:
  pull_request_target:
    types: [opened, ready_for_review, synchronize]
permissions:
  contents: read
concurrency:
  group: qa-trigger-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  dispatch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Start QA on the pull request branch
        env:
          GH_TOKEN: ${{ secrets.AGENT_ASSIGN_TOKEN }}
          REF: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run qa.yml --repo "$GITHUB_REPOSITORY" --ref "$REF"
